<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urne du Bureau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#101A27; --muted:#556272; --line:#D7DDE5;
  --accent:#1F3FD1; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD;
  --ok:#11704A; --ok-soft:#DCF2E7; --warn:#80530A; --warn-soft:#FAEBC9; --danger:#B3261E;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D141D; --surface:#151F2B; --ink:#E8EDF3; --muted:#9BA9B9; --line:#27364A;
    --accent:#8CA0FF; --accent-ink:#0B1430; --accent-soft:#1C2850;
    --ok:#5FD39B; --ok-soft:#133726; --warn:#F0C26A; --warn-soft:#3A2D0E; --danger:#FF8A80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding:28px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:700} p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.fine{font-size:.88rem;color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.ballot{background:var(--surface);border:2px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.ballot-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:var(--bg);font-family:var(--font-display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.9rem}
.ballot-body{padding:8px 20px 22px;display:flex;flex-direction:column;gap:6px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column}
legend{padding:14px 0 8px;font-size:.95rem;color:var(--muted)}
.opt{display:flex;align-items:center;gap:16px;padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:3px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:2px;display:grid;place-items:center;background:var(--surface)}
.box svg{width:20px;height:20px;opacity:0}
.opt.sel{background:var(--accent-soft)} .opt.sel .box{border-color:var(--accent)} .opt.sel .box svg{opacity:1;color:var(--accent)}
.opt-txt{display:flex;flex-direction:column;min-width:0} .opt-txt strong{font-size:1.05rem} .opt-txt small{color:var(--muted);font-size:.88rem}
.opt.blank{border-top:2px dashed var(--line);border-bottom:0;margin-top:6px} .opt.blank strong{font-weight:500;color:var(--muted)}
.confirm-choice{font-family:var(--font-display);font-size:1.6rem;font-weight:700;border:2px dashed var(--ink);padding:16px;border-radius:3px}
.notice{padding:12px 14px;border-radius:4px;font-size:.95rem;background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.err{color:var(--danger)}
.done{display:flex;gap:16px;align-items:flex-start}
.done .ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.bar-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.bar-top .nm{font-weight:600} .bar-top .val{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:14px;background:var(--bg);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--muted);min-width:2px} .win .fill{background:var(--accent)} .win .nm::after{content:" ✓";color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0}
.stats div{border-top:2px solid var(--ink);padding-top:8px}
.stats dt{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stats dd{margin:0;font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input.code{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cand{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mono{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.cand .grow{flex:1;min-width:0;display:flex;flex-direction:column} .cand .grow small{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.code{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.tag{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.card{padding:18px}.ballot-body{padding-inline:12px}}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><header class="top"><p class="eyebrow">Élection</p><h1>Chargement…</h1></header></main>
<script src="app.js"></script>
</body>
</html>
